name: publish
on:
  push:
    tags: ["v*"]
  # Run on main with a version to cut that release: the run tags main once
  # CI passes, then publishes. Run on an existing tag, without a version, to
  # retry a release. Either way the person who starts it is the run's actor,
  # which JSR requires to be a member of the @tlockney scope (#315).
  workflow_dispatch:
    inputs:
      version:
        description: Version to release from main, as in package.json (e.g. 0.6.1). Leave empty when running on a tag.
        required: false
        type: string
jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.check.outputs.tag }}
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
      # A JSR kernelspec relaunches with a dependency cutoff two days after
      # RELEASE_DATE (#12). A stale date would block this very release, so
      # it must be today's or yesterday's (UTC).
      - name: ready to release
        id: check
        run: |
          fail() { echo "$1" >&2; exit 1; }
          actual="$(node -p "require('./package.json').version")"
          if [ -n "$VERSION" ]; then
            [ "$GITHUB_REF" = refs/heads/main ] || fail "run with a version on main, not $GITHUB_REF_NAME"
            [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || fail "'$VERSION' is not a version"
            [ "$actual" = "$VERSION" ] || fail "main's package.json is $actual, not $VERSION; merge the version bump first"
            tag="v$VERSION"
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
              fail "$tag already exists; to re-run its publish: gh workflow run publish.yml --ref $tag"
            fi
          else
            [ "$GITHUB_REF_TYPE" = tag ] || fail "run on a tag, or on main with a version"
            tag="$GITHUB_REF_NAME"
            [ "$tag" = "v$actual" ] || fail "tag $tag does not match package.json $actual"
          fi
          released="$(sed -n 's/^export const RELEASE_DATE = "\(.*\)";$/\1/p' src/package.ts)"
          today="$(date -u +%F)"
          yesterday="$(date -u -d yesterday +%F)"
          [ "$released" = "$today" ] || [ "$released" = "$yesterday" ] \
            || fail "src/package.ts RELEASE_DATE is '$released'; set it to $today (and the CHANGELOG.md heading) with the version bump"
          grep -qxF "## $actual ($released)" CHANGELOG.md || fail "CHANGELOG.md has no '## $actual ($released)' heading"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  # Run with a version, tags the commit CI just passed on. A tag pushed with
  # the workflow's token starts no other run. On a tag, there is nothing to do.
  tag:
    needs: [verify, version]
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the tag
    steps:
      - if: inputs.version != ''
        uses: actions/checkout@v4
      - if: inputs.version != ''
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG" "$GITHUB_SHA"
          git push origin "$TAG"

  jsr:
    needs: tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # JSR OIDC: link this repo in the package's JSR settings
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # JSR rejects republishing a version; skip so a re-run is harmless.
      - name: skip if already on JSR
        id: jsr
        run: |
          version="$(node -p "require('./package.json').version")"
          if curl -fsS https://jsr.io/@tlockney/cdp-kernel/meta.json | grep -q "\"$version\""; then
            echo "@tlockney/cdp-kernel@$version is already on JSR; skipping"
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi
      # With a package.json present, Deno resolves the npm dependencies from
      # node_modules, so fill it first (ci.yml gets this from `npm ci`).
      - if: steps.jsr.outputs.published != 'true'
        run: deno install
      - if: steps.jsr.outputs.published != 'true'
        run: deno publish

  npm:
    needs: tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (configured on npmjs.com)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
      # npm rejects republishing a version; skip so a re-run is harmless.
      - name: skip if already on npm
        id: npm
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "@tlockney/cdp-kernel@$version" version >/dev/null 2>&1; then
            echo "@tlockney/cdp-kernel@$version is already on npm; skipping"
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.npm.outputs.published != 'true'
        run: npm ci
      # No token: npm >= 11.5.1 exchanges this job's OIDC token through the
      # trusted publisher set up for tlockney/cdp-kernel + publish.yml.
      # prepack builds dist/. --provenance attaches a signed attestation of
      # the commit and workflow that built the release (needs a public repo).
      - if: steps.npm.outputs.published != 'true'
        run: |
          echo "npm $(npm --version)"
          npm publish --provenance

  # The published JSR package, run the way docs/install.md tells users to:
  # nothing before release exercises the jsr: specifier, its --no-config
  # relaunch, or runtime/*.mjs fetched from jsr.io (#12, #146).
  jsr-smoke:
    needs: jsr
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: astral-sh/setup-uv@v6
      - name: wait for the version to be served
        run: |
          version="$(node -p "require('./package.json').version")"
          for i in $(seq 30); do
            if curl -fsS https://jsr.io/@tlockney/cdp-kernel/meta.json | grep -q "\"$version\""; then exit 0; fi
            sleep 10
          done
          echo "@tlockney/cdp-kernel@$version is not on JSR after 5 minutes" >&2
          exit 1
      # From a scratch directory, so no checkout config is in reach.
      - name: e2e (JSR package)
        timeout-minutes: 10
        working-directory: ${{ runner.temp }}
        run: |
          version="$(node -p "require('$GITHUB_WORKSPACE/package.json').version")"
          cli="deno run -A --no-config --min-dep-age=0 jsr:@tlockney/cdp-kernel@$version/cli"
          $cli version
          CDPK_E2E_CLI="$cli" uv run --with nbclient --with nbformat --with jupyter_client \
            python "$GITHUB_WORKSPACE/test/e2e.py" node deno

  # The container image (container/Dockerfile) with the release just put
  # on npm, pushed to ghcr.io/tlockney/cdp-kernel as the version and
  # `latest`, for amd64 and arm64 (#269). The amd64 build is smoke-tested
  # before anything is pushed.
  image:
    needs: npm
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: wait for the version to be served
        run: |
          version="$(node -p "require('./package.json').version")"
          for i in $(seq 30); do
            if npm view "@tlockney/cdp-kernel@$version" version >/dev/null 2>&1; then exit 0; fi
            sleep 10
          done
          echo "@tlockney/cdp-kernel@$version is not on npm after 5 minutes" >&2
          exit 1
      - id: meta
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: build (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: container/Dockerfile
          platforms: linux/amd64
          load: true
          tags: cdp-kernel:test
          cache-to: type=gha,mode=max
      - name: smoke test
        timeout-minutes: 10
        run: docker run --rm -v "$PWD/container:/test:ro" cdp-kernel:test python /test/smoke-test.py
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: build and push (amd64, arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: container/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=gha
          tags: |
            ghcr.io/tlockney/cdp-kernel:${{ steps.meta.outputs.version }}
            ghcr.io/tlockney/cdp-kernel:latest
          labels: |
            org.opencontainers.image.source=https://github.com/tlockney/cdp-kernel
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.licenses=MIT

  # The GitHub release for the tag, with the version's CHANGELOG.md entry
  # (test/package.test.ts makes sure there is one) as its notes.
  release:
    needs: [version, jsr, npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: create the release unless it exists
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          version="${TAG#v}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists; skipping"
            exit 0
          fi
          # The lines between this version's heading and the next one.
          awk -v v="$version" '
            /^## / { if (found) exit; if (index($0, "## " v " (") == 1) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "CHANGELOG.md has no entry for $version" >&2
            exit 1
          fi
          gh release create "$TAG" --title "$TAG" --notes-file notes.md --verify-tag
