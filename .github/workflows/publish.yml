name: publish
on:
  push:
    tags: ["v*"]
  # Run on a tag by release.yml (a tag it pushes starts nothing), or by hand
  # to retry a release. Run on a branch, the version job fails.
  workflow_dispatch:
jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: tag matches package version
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json $version" >&2
            exit 1
          fi
      # A JSR kernelspec relaunches with a dependency cutoff two days after
      # RELEASE_DATE (#12). A stale date would block this very release, so
      # it must be today's or yesterday's (UTC).
      - name: release date is current
        run: |
          released="$(sed -n 's/^export const RELEASE_DATE = "\(.*\)";$/\1/p' src/package.ts)"
          today="$(date -u +%F)"
          yesterday="$(date -u -d yesterday +%F)"
          if [ "$released" != "$today" ] && [ "$released" != "$yesterday" ]; then
            echo "src/package.ts RELEASE_DATE is '$released'; set it to $today with the version bump" >&2
            exit 1
          fi

  jsr:
    needs: [verify, version]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # JSR OIDC: link this repo in the package's JSR settings
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # JSR rejects republishing a version; skip so a re-run is harmless.
      - name: skip if already on JSR
        id: jsr
        run: |
          version="$(node -p "require('./package.json').version")"
          if curl -fsS https://jsr.io/@tlockney/cdp-kernel/meta.json | grep -q "\"$version\""; then
            echo "@tlockney/cdp-kernel@$version is already on JSR; skipping"
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi
      # With a package.json present, Deno resolves the npm dependencies from
      # node_modules, so fill it first (ci.yml gets this from `npm ci`).
      - if: steps.jsr.outputs.published != 'true'
        run: deno install
      - if: steps.jsr.outputs.published != 'true'
        run: deno publish

  npm:
    needs: [verify, version]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (configured on npmjs.com)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
      # npm rejects republishing a version; skip so a re-run is harmless.
      - name: skip if already on npm
        id: npm
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "@tlockney/cdp-kernel@$version" version >/dev/null 2>&1; then
            echo "@tlockney/cdp-kernel@$version is already on npm; skipping"
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.npm.outputs.published != 'true'
        run: npm ci
      # No token: npm >= 11.5.1 exchanges this job's OIDC token through the
      # trusted publisher set up for tlockney/cdp-kernel + publish.yml.
      # prepack builds dist/. --provenance attaches a signed attestation of
      # the commit and workflow that built the release (needs a public repo).
      - if: steps.npm.outputs.published != 'true'
        run: |
          echo "npm $(npm --version)"
          npm publish --provenance

  # The published JSR package, run the way docs/install.md tells users to:
  # nothing before release exercises the jsr: specifier, its --no-config
  # relaunch, or runtime/*.mjs fetched from jsr.io (#12, #146).
  jsr-smoke:
    needs: jsr
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: astral-sh/setup-uv@v6
      - name: wait for the version to be served
        run: |
          version="$(node -p "require('./package.json').version")"
          for i in $(seq 30); do
            if curl -fsS https://jsr.io/@tlockney/cdp-kernel/meta.json | grep -q "\"$version\""; then exit 0; fi
            sleep 10
          done
          echo "@tlockney/cdp-kernel@$version is not on JSR after 5 minutes" >&2
          exit 1
      # From a scratch directory, so no checkout config is in reach.
      - name: e2e (JSR package)
        timeout-minutes: 10
        working-directory: ${{ runner.temp }}
        run: |
          version="$(node -p "require('$GITHUB_WORKSPACE/package.json').version")"
          cli="deno run -A --no-config --min-dep-age=0 jsr:@tlockney/cdp-kernel@$version/cli"
          $cli version
          CDPK_E2E_CLI="$cli" uv run --with nbclient --with nbformat --with jupyter_client \
            python "$GITHUB_WORKSPACE/test/e2e.py" node deno

  # The container image (container/Dockerfile) with the release just put
  # on npm, pushed to ghcr.io/tlockney/cdp-kernel as the version and
  # `latest`, for amd64 and arm64 (#269). The amd64 build is smoke-tested
  # before anything is pushed.
  image:
    needs: npm
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: wait for the version to be served
        run: |
          version="$(node -p "require('./package.json').version")"
          for i in $(seq 30); do
            if npm view "@tlockney/cdp-kernel@$version" version >/dev/null 2>&1; then exit 0; fi
            sleep 10
          done
          echo "@tlockney/cdp-kernel@$version is not on npm after 5 minutes" >&2
          exit 1
      - id: meta
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: build (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: container/Dockerfile
          platforms: linux/amd64
          load: true
          tags: cdp-kernel:test
          cache-to: type=gha,mode=max
      - name: smoke test
        timeout-minutes: 10
        run: docker run --rm -v "$PWD/container:/test:ro" cdp-kernel:test python /test/smoke-test.py
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: build and push (amd64, arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: container/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=gha
          tags: |
            ghcr.io/tlockney/cdp-kernel:${{ steps.meta.outputs.version }}
            ghcr.io/tlockney/cdp-kernel:latest
          labels: |
            org.opencontainers.image.source=https://github.com/tlockney/cdp-kernel
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.licenses=MIT

  # The GitHub release for the tag, with the version's CHANGELOG.md entry
  # (test/package.test.ts makes sure there is one) as its notes.
  release:
    needs: [jsr, npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: create the release unless it exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists; skipping"
            exit 0
          fi
          # The lines between this version's heading and the next one.
          awk -v v="$version" '
            /^## / { if (found) exit; if (index($0, "## " v " (") == 1) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "CHANGELOG.md has no entry for $version" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
