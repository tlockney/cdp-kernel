name: publish
on:
  push:
    tags: ["v*"]
jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: tag matches package version
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json $version" >&2
            exit 1
          fi
      # A JSR kernelspec relaunches with a dependency cutoff two days after
      # RELEASE_DATE (#12). A stale date would block this very release, so
      # it must be today's or yesterday's (UTC).
      - name: release date is current
        run: |
          released="$(sed -n 's/^export const RELEASE_DATE = "\(.*\)";$/\1/p' src/package.ts)"
          today="$(date -u +%F)"
          yesterday="$(date -u -d yesterday +%F)"
          if [ "$released" != "$today" ] && [ "$released" != "$yesterday" ]; then
            echo "src/package.ts RELEASE_DATE is '$released'; set it to $today with the version bump" >&2
            exit 1
          fi

  jsr:
    needs: [verify, version]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # JSR OIDC: link this repo in the package's JSR settings
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # JSR rejects republishing a version; skip so a re-run is harmless.
      - name: skip if already on JSR
        id: jsr
        run: |
          version="$(node -p "require('./package.json').version")"
          if curl -fsS https://jsr.io/@tlockney/cdp-kernel/meta.json | grep -q "\"$version\""; then
            echo "@tlockney/cdp-kernel@$version is already on JSR; skipping"
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi
      # With a package.json present, Deno resolves the npm dependencies from
      # node_modules, so fill it first (ci.yml gets this from `npm ci`).
      - if: steps.jsr.outputs.published != 'true'
        run: deno install
      - if: steps.jsr.outputs.published != 'true'
        run: deno publish

  npm:
    needs: [verify, version]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (configured on npmjs.com)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
      # npm rejects republishing a version; skip so a re-run is harmless.
      - name: skip if already on npm
        id: npm
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "@tlockney/cdp-kernel@$version" version >/dev/null 2>&1; then
            echo "@tlockney/cdp-kernel@$version is already on npm; skipping"
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.npm.outputs.published != 'true'
        run: npm ci
      # No token: npm >= 11.5.1 exchanges this job's OIDC token through the
      # trusted publisher set up for tlockney/cdp-kernel + publish.yml.
      # prepack builds dist/. --provenance attaches a signed attestation of
      # the commit and workflow that built the release (needs a public repo).
      - if: steps.npm.outputs.published != 'true'
        run: |
          echo "npm $(npm --version)"
          npm publish --provenance
