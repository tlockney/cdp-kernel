name: release
# Cuts a release from main without a local checkout (#235): checks that main
# is ready to ship as `version`, tags it, and starts publish.yml on the tag.
# The version bump and CHANGELOG.md entry still land on main by a PR first.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, as in package.json (e.g. 0.6.0)
        required: true
        type: string
concurrency: release
jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the tag
      actions: write # start publish.yml
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      # The same checks publish.yml's version job makes, done before the tag
      # exists so a failure leaves nothing to clean up.
      - name: main is ready to release
        run: |
          tag="v$VERSION"
          fail() { echo "$1" >&2; exit 1; }
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || fail "'$VERSION' is not a version"
          actual="$(node -p "require('./package.json').version")"
          [ "$actual" = "$VERSION" ] || fail "main's package.json is $actual, not $VERSION; merge the version bump first"
          released="$(sed -n 's/^export const RELEASE_DATE = "\(.*\)";$/\1/p' src/package.ts)"
          today="$(date -u +%F)"
          yesterday="$(date -u -d yesterday +%F)"
          [ "$released" = "$today" ] || [ "$released" = "$yesterday" ] \
            || fail "src/package.ts RELEASE_DATE is '$released'; set it to $today (and the CHANGELOG.md heading) by a PR"
          grep -qxF "## $VERSION ($released)" CHANGELOG.md || fail "CHANGELOG.md has no '## $VERSION ($released)' heading"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            fail "$tag already exists; to re-run its publish: gh workflow run publish.yml --ref $tag"
          fi
      - name: tag main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "v$VERSION"
          git push origin "v$VERSION"
      # A tag pushed with GITHUB_TOKEN starts no workflows, but a
      # workflow_dispatch does, so publish.yml runs on the tag as it would
      # after a push from a checkout.
      - name: start publish
        run: |
          gh workflow run publish.yml --ref "v$VERSION"
          echo "Started publish for v$VERSION: https://github.com/${{ github.repository }}/actions/workflows/publish.yml" >> "$GITHUB_STEP_SUMMARY"
