name: bench
# Startup and per-cell latency of each runtime (#265), as a trend: runner
# timings are noisy, so this never gates a merge. The medians go to the
# job summary and every sample to the bench-results artifact.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1" # Mondays, so a quiet week still gets a point
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.x # docs/install.md names the tested Bun
      # celld isn't on npm: the pinned release, checked against its
      # SHA-256, into ~/.local/bin, where the kernel looks first (#25).
      - name: celld
        run: scripts/install-celld.sh
      - run: npm ci
      - run: npm run bench -- --json "$RUNNER_TEMP/bench.json"
        timeout-minutes: 20
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: bench-results
          path: ${{ runner.temp }}/bench.json
          if-no-files-found: ignore
