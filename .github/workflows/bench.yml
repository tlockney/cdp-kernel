name: bench
# Startup and per-cell latency of each runtime (#265), as a trend: runner
# timings are noisy, so this never gates a merge. The medians go to the
# job summary and every sample to the bench-results artifact.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1" # Mondays, so a quiet week still gets a point
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.x # docs/install.md names the tested Bun
      # celld isn't on npm: the pinned release, checked against its
      # SHA-256, into ~/.local/bin, where the kernel looks first (#25).
      - name: celld
        run: scripts/install-celld.sh
      - run: npm ci
      - run: npm run bench -- --json "$RUNNER_TEMP/bench.json"
        timeout-minutes: 20
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: bench-results
          path: ${{ runner.temp }}/bench.json
          if-no-files-found: ignore
