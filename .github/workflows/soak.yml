name: soak
# One long kernel session per runtime: thousands of mixed requests, large
# and binary outputs, interrupts, and a memory check (#260). Too slow and
# too broad for every PR, so it runs weekly, by hand, and on PRs that
# change it. Not a required check.
on:
  schedule:
    - cron: "23 5 * * 3"
  workflow_dispatch:
    inputs:
      cells:
        description: Requests per runtime
        default: "2000"
  pull_request:
    paths: [.github/workflows/soak.yml, test/soak.py]
permissions:
  contents: read
jobs:
  soak:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.x # docs/install.md names the tested Bun
      # celld isn't on npm: the pinned release, checked against its
      # SHA-256, into ~/.local/bin, where the kernel looks first (#25).
      - name: celld
        run: scripts/install-celld.sh
      - run: npm ci
      - run: npm run soak
        timeout-minutes: 30
        env:
          CDPK_SOAK_CELLS: ${{ inputs.cells || '2000' }}
