name: Soak
# One long kernel session per runtime: thousands of mixed requests, large
# and binary outputs, interrupts, and a memory check (#260). Too slow and
# too broad for every PR, so it runs weekly, by hand, and on PRs that
# change it. Not a required check.
on:
  schedule:
    - cron: "23 5 * * 3"
  workflow_dispatch:
    inputs:
      cells:
        description: Requests per runtime
        default: "2000"
  pull_request:
    paths: [.github/workflows/soak.yml, test/soak.py]
permissions:
  contents: read
jobs:
  soak:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.x # docs/install.md names the tested Bun
      # celld isn't on npm: the pinned release, checked against its
      # SHA-256, into ~/.local/bin, where the kernel looks first (#25).
      - name: celld
        run: scripts/install-celld.sh
      - run: npm ci
      - run: npm run soak
        timeout-minutes: 30
        env:
          CDPK_SOAK_CELLS: ${{ inputs.cells || '2000' }}

  # A scheduled failure opens an issue, or comments on the open one, as
  # latest.yml's report job does: nobody watches a weekly run.
  report:
    needs: soak
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TITLE: "Weekly soak run failed"
      RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - run: |
          open=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number,title \
            --jq "map(select(.title == env.TITLE)) | .[0].number // empty")
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "Failed again: $RUN"
          else
            gh issue create --title "$TITLE" --body "The [soak run]($RUN) failed."
          fi
