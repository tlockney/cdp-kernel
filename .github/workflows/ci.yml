name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  # Whether a pull request needs the jobs below: scripts/ci-changes.sh says
  # no when it changes only docs, the site or Markdown (#431). The jobs
  # then report success under their required names without running: the
  # others are skipped by their `if`, and each test cell runs on Linux with
  # every step skipped, since a matrix job skipped whole wouldn't report
  # per-cell checks. If this job fails, its output is empty and everything
  # runs. A push to main is checked the same way (#433).
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.changes.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The merge commit and its first parent, the base.
          fetch-depth: 2
      - id: changes
        run: scripts/ci-changes.sh | tee -a "$GITHUB_OUTPUT"
        env:
          # A push's base: main before the push (the script fetches it).
          BASE_SHA: ${{ github.event.before }}

  # Several behaviours the kernel relies on were found by probing rather
  # than documented (#15): interrupt over a second CDP session, Node
  # rejecting import() in inspector code, module.registerHooks, Deno's
  # configurable `Deno` global. So every supported runtime version runs the
  # whole suite, on Linux and macOS.
  test:
    needs: changes
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24, 26]
        # macOS runners are shared with the other Ganymede repos and were
        # what PRs queued for, so macOS runs the newest Node only (#434);
        # Linux runs every supported line.
        exclude:
          - os: macos-latest
            node: 22
          - os: macos-latest
            node: 24
        # One Deno: v2.x and the 2.9.x LTS line resolve to the same release
        # while Deno stays on 2.9 (denoland/deno#37030), so a second value
        # would only repeat every cell (#146). Add one back when they diverge.
        deno: [v2.x]
        include:
          # The runs against what would actually ship (the packed npm
          # tarball, and the CLI run by Deno: the JSR path) need only one cell.
          - os: ubuntu-latest
            node: 26
            deno: v2.x
            shipped: true
    name: test (${{ matrix.os }}, node ${{ matrix.node }}, deno ${{ matrix.deno }})
    runs-on: ${{ needs.changes.outputs.code == 'false' && 'ubuntu-latest' || matrix.os }}
    timeout-minutes: 40
    steps:
      - if: needs.changes.outputs.code == 'false'
        run: echo "Only docs, the site or Markdown changed, so nothing to test (#431)."
      - if: needs.changes.outputs.code != 'false'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: needs.changes.outputs.code != 'false'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - if: needs.changes.outputs.code != 'false'
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: ${{ matrix.deno }}
      - if: needs.changes.outputs.code != 'false'
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - if: needs.changes.outputs.code != 'false'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.x # docs/install.md names the tested Bun
      # celld isn't on npm: the pinned release, checked against its
      # SHA-256, into ~/.local/bin, where the kernel looks first (#25).
      - if: needs.changes.outputs.code != 'false'
        name: celld
        run: scripts/install-celld.sh

      - if: needs.changes.outputs.code != 'false'
        run: npm ci
      - if: needs.changes.outputs.code != 'false'
        run: npm run check
      # Each takes a few minutes at most. A hang should fail the job, not hold
      # a runner until the job's own timeout (#52).
      - if: needs.changes.outputs.code != 'false'
        run: npm test
        timeout-minutes: 10
      - if: needs.changes.outputs.code != 'false'
        run: npm run e2e
        timeout-minutes: 10
      - if: needs.changes.outputs.code != 'false' && (matrix.shipped)
        run: deno publish --dry-run
      - name: e2e (npm package)
        if: needs.changes.outputs.code != 'false' && (matrix.shipped)
        timeout-minutes: 10
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/pkg" && cd "$RUNNER_TEMP/pkg"
          echo '{"private":true}' > package.json
          npm install --no-audit --no-fund "$RUNNER_TEMP"/tlockney-cdp-kernel-*.tgz
          cd "$GITHUB_WORKSPACE"
          CDPK_E2E_CLI="$RUNNER_TEMP/pkg/node_modules/.bin/cdp-kernel" npm run e2e
      - name: e2e (Deno host)
        if: needs.changes.outputs.code != 'false' && (matrix.shipped)
        timeout-minutes: 10
        run: CDPK_E2E_CLI="deno run -A src/main.ts" npm run e2e

  # The container image (container/Dockerfile, #267), built from the
  # checkout, with a cell run on every kernelspec inside it.
  image:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -f container/Dockerfile --build-arg CDPK_SOURCE=checkout -t cdp-kernel .
      - run: docker run --rm -v "$PWD/container:/test:ro" cdp-kernel python /test/smoke-test.py
        timeout-minutes: 10

  # The browser target (src/browser/, test/browser.test.ts) in each of
  # Playwright's engines. The test is skipped without the playwright
  # package, which isn't a dependency, so no other job runs it (#319).
  browser:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - run: npm ci
      # Playwright 1.56's install hangs after the download on Node 26.
      - run: npm install --no-save --no-audit --no-fund playwright@1.64.1
      - run: npx playwright install --with-deps chromium webkit firefox
        timeout-minutes: 10
      - run: CDPK_BROWSER=chromium node --test test/browser.test.ts
        timeout-minutes: 5
      - run: CDPK_BROWSER=webkit node --test test/browser.test.ts
        timeout-minutes: 5
      - run: CDPK_BROWSER=firefox node --test test/browser.test.ts
        timeout-minutes: 5

  # No Windows job: Windows isn't supported yet, and is its own issue (#32).

  # Widgets against the real frontend: JupyterLab with the anywidget
  # extension, driven by headless Chromium (test/lab_widgets.py).
  lab:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.x # docs/install.md names the tested Bun
      # celld isn't on npm: the pinned release, checked against its
      # SHA-256, into ~/.local/bin, where the kernel looks first (#25).
      - name: celld
        run: scripts/install-celld.sh
      - run: npm ci
      - name: Chromium and its system libraries
        run: uv run --with playwright python -m playwright install --with-deps chromium
      - run: npm run test:lab
        timeout-minutes: 10
