name: pages
on:
  push:
    branches: [main]
    paths: [site/**, docs/**, package.json, package-lock.json, .github/workflows/pages.yml]
  # Builds without deploying, so a broken docs page or dead link fails the PR
  # rather than the deploy.
  pull_request:
    paths: [site/**, docs/**, package.json, package-lock.json, .github/workflows/pages.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # The landing page is plain HTML and CSS in site/, served at /. The topic
  # docs are Markdown in docs/, built by VitePress into /docs/
  # (docs/.vitepress/config.mts). site/study.html redirects the study's old
  # address to its docs page.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run docs:build
      - name: assemble
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          cp -R site/. "$RUNNER_TEMP/site/"
          cp -R docs/.vitepress/dist "$RUNNER_TEMP/site/docs"
          cp -R docs/images "$RUNNER_TEMP/site/images"
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: ${{ runner.temp }}/site
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
