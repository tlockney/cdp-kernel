name: Pages
on:
  push:
    branches: [main]
    paths: [site/**, docs/**, package.json, package-lock.json, .github/workflows/pages.yml]
  # Builds without deploying, so a broken docs page or dead link fails the PR
  # rather than the deploy.
  pull_request:
    paths: [site/**, docs/**, package.json, package-lock.json, .github/workflows/pages.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # The landing page is plain HTML and CSS in site/, served at /. The topic
  # docs are Markdown in docs/, built by VitePress into /docs/
  # (docs/.vitepress/config.mts). site/study.html redirects the study's old
  # address to its docs page.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run docs:build
      - name: assemble
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          cp -R site/. "$RUNNER_TEMP/site/"
          cp -R docs/.vitepress/dist "$RUNNER_TEMP/site/docs"
          cp -R docs/images "$RUNNER_TEMP/site/images"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/site
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
