<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" width="860" height="330" role="img" aria-label="The frontend sends each cell's code to the kernel host over the Jupyter protocol. The kernel host, the process Jupyter starts, drives a target runtime in a separate process over CDP, a pipe or a WebSocket session, and the results and output come back to show under the cell.">
  <title>The frontend talks to the kernel host over the Jupyter protocol, and the host drives a separate target runtime process</title>
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #f6f7f9; stroke: #9aa3ad; stroke-width: 1.2; }
    .inner { fill: #ffffff; stroke: #b8c0c8; stroke-width: 1; }
    .acc { fill: #e8f0fe; stroke: #3b6fd8; stroke-width: 1.4; }
    .warn { fill: #fdf0e6; stroke: #c96a1b; stroke-width: 1.4; }
    .ok { fill: #e7f5ec; stroke: #2f8a4c; stroke-width: 1.4; }
    .t { font: 600 14px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1f2328; }
    .s { font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #57606a; }
    .m { font: 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #1f2328; }
    .l { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #57606a; }
    .lm { font: 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #57606a; }
    .str { fill: #2f8a4c; }
    .num { fill: #b35900; }
    .ln { stroke: #6e7781; stroke-width: 1.4; fill: none; }
    .ah { fill: #6e7781; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1b1b1f; }
      .box { fill: #25262b; stroke: #5c6370; }
      .inner { fill: #1b1b1f; stroke: #4a505a; }
      .acc { fill: #1e2a44; stroke: #6b9bff; }
      .warn { fill: #3a2a1c; stroke: #e0904a; }
      .ok { fill: #1d3326; stroke: #5cc27e; }
      .t, .m { fill: #e6e8eb; }
      .s, .l, .lm { fill: #a0a7b0; }
      .str { fill: #5cc27e; }
      .num { fill: #e0904a; }
      .ln { stroke: #a0a7b0; }
      .ah { fill: #a0a7b0; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="ah" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="860" height="330" rx="8"/>
  <!-- Frontend with a notebook -->
  <rect class="box" x="20" y="20" width="270" height="290" rx="6"/>
  <text class="t" x="36" y="44">Frontend</text>
  <text class="s" x="36" y="62">JupyterLab or VS Code</text>
  <rect class="inner" x="36" y="76" width="238" height="218" rx="4"/>
  <text class="l" x="48" y="96">analysis.ipynb</text>
  <rect class="acc" x="48" y="106" width="214" height="44" rx="3"/>
  <text class="lm" x="56" y="124">[1]</text>
  <text class="m" x="80" y="124">const greeting = <tspan class="str">"Hello"</tspan>;</text>
  <text class="m" x="80" y="140">greeting + <tspan class="str">", notebook"</tspan></text>
  <rect class="ok" x="48" y="152" width="214" height="26" rx="3"/>
  <text class="m" x="80" y="170"><tspan class="str">'Hello, notebook'</tspan></text>
  <rect class="acc" x="48" y="188" width="214" height="28" rx="3"/>
  <text class="lm" x="56" y="207">[2]</text>
  <text class="m" x="80" y="207">greeting.length</text>
  <rect class="ok" x="48" y="218" width="214" height="26" rx="3"/>
  <text class="m" x="80" y="236"><tspan class="num">5</tspan></text>
  <text class="l" x="56" y="268">code cells, each with its output,</text>
  <text class="l" x="56" y="283">saved together in one file</text>

  <!-- Frontend to kernel host: the Jupyter protocol -->
  <text class="s" x="345" y="104" text-anchor="middle">Jupyter protocol</text>
  <text class="l" x="345" y="120" text-anchor="middle">over ZeroMQ</text>
  <line class="ln" x1="290" y1="150" x2="398" y2="150" marker-end="url(#a)"/>
  <text class="l" x="345" y="142" text-anchor="middle">each cell's code</text>
  <line class="ln" x1="292" y1="190" x2="400" y2="190" marker-start="url(#a)"/>
  <text class="l" x="345" y="208" text-anchor="middle">results, printed</text>
  <text class="l" x="345" y="222" text-anchor="middle">text, rich output</text>

  <!-- Kernel host process -->
  <rect class="box" x="400" y="20" width="170" height="290" rx="6" stroke-dasharray="6 4"/>
  <text class="t" x="485" y="44" text-anchor="middle">Kernel host</text>
  <text class="s" x="485" y="62" text-anchor="middle">the process Jupyter</text>
  <text class="s" x="485" y="78" text-anchor="middle">starts: Node or Deno</text>
  <rect class="acc" x="414" y="104" width="142" height="128" rx="6"/>
  <text class="t" x="485" y="130" text-anchor="middle">cdp-kernel</text>
  <text class="s" x="485" y="154" text-anchor="middle">speaks Jupyter's</text>
  <text class="s" x="485" y="170" text-anchor="middle">protocol, turns each</text>
  <text class="s" x="485" y="186" text-anchor="middle">cell into a script and</text>
  <text class="s" x="485" y="202" text-anchor="middle">drives the target</text>
  <text class="l" x="485" y="272" text-anchor="middle">stays connected to</text>
  <text class="l" x="485" y="286" text-anchor="middle">Jupyter when the</text>
  <text class="l" x="485" y="300" text-anchor="middle">target restarts</text>

  <!-- Kernel host to target: one channel per runtime -->
  <text class="l" x="625" y="136" text-anchor="middle">CDP, a pipe, or a</text>
  <text class="l" x="625" y="150" text-anchor="middle">WebSocket session</text>
  <line class="ln" x1="572" y1="165" x2="678" y2="165" marker-start="url(#a)" marker-end="url(#a)"/>
  <text class="l" x="625" y="184" text-anchor="middle">depending on</text>
  <text class="l" x="625" y="198" text-anchor="middle">the runtime</text>

  <!-- Target runtime process -->
  <rect class="box" x="680" y="20" width="160" height="290" rx="6" stroke-dasharray="6 4"/>
  <text class="t" x="760" y="44" text-anchor="middle">Target runtime</text>
  <text class="s" x="760" y="62" text-anchor="middle">a separate process;</text>
  <text class="s" x="760" y="78" text-anchor="middle">your cells run here</text>
  <rect class="inner" x="696" y="96" width="128" height="26" rx="13"/>
  <text class="m" x="760" y="113" text-anchor="middle">Node</text>
  <rect class="inner" x="696" y="130" width="128" height="26" rx="13"/>
  <text class="m" x="760" y="147" text-anchor="middle">Deno</text>
  <rect class="inner" x="696" y="164" width="128" height="26" rx="13"/>
  <text class="m" x="760" y="181" text-anchor="middle">Bun</text>
  <rect class="inner" x="696" y="198" width="128" height="26" rx="13"/>
  <text class="m" x="760" y="215" text-anchor="middle">workerd</text>
  <rect class="inner" x="696" y="232" width="128" height="26" rx="13"/>
  <text class="m" x="760" y="249" text-anchor="middle">celld</text>
  <text class="l" x="760" y="272" text-anchor="middle">the one you picked; if it</text>
  <text class="l" x="760" y="286" text-anchor="middle">exits, the host starts</text>
  <text class="l" x="760" y="300" text-anchor="middle">a new one</text>
</svg>
