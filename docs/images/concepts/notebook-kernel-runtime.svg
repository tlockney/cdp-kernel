<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" width="860" height="330" role="img" aria-label="The frontend shows the notebook and sends each cell's code to cdp-kernel, which runs it in the runtime you picked and sends the output back">
  <title>The frontend shows the notebook and sends each cell's code to cdp-kernel, which runs it in the runtime you picked and sends the output back</title>
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #f6f7f9; stroke: #9aa3ad; stroke-width: 1.2; }
    .inner { fill: #ffffff; stroke: #b8c0c8; stroke-width: 1; }
    .acc { fill: #e8f0fe; stroke: #3b6fd8; stroke-width: 1.4; }
    .warn { fill: #fdf0e6; stroke: #c96a1b; stroke-width: 1.4; }
    .ok { fill: #e7f5ec; stroke: #2f8a4c; stroke-width: 1.4; }
    .t { font: 600 14px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1f2328; }
    .s { font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #57606a; }
    .m { font: 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #1f2328; }
    .l { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #57606a; }
    .lm { font: 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #57606a; }
    .str { fill: #2f8a4c; }
    .num { fill: #b35900; }
    .ln { stroke: #6e7781; stroke-width: 1.4; fill: none; }
    .ah { fill: #6e7781; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1b1b1f; }
      .box { fill: #25262b; stroke: #5c6370; }
      .inner { fill: #1b1b1f; stroke: #4a505a; }
      .acc { fill: #1e2a44; stroke: #6b9bff; }
      .warn { fill: #3a2a1c; stroke: #e0904a; }
      .ok { fill: #1d3326; stroke: #5cc27e; }
      .t, .m { fill: #e6e8eb; }
      .s, .l, .lm { fill: #a0a7b0; }
      .str { fill: #5cc27e; }
      .num { fill: #e0904a; }
      .ln { stroke: #a0a7b0; }
      .ah { fill: #a0a7b0; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="ah" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="860" height="330" rx="8"/>
  <!-- Frontend with a notebook -->
  <rect class="box" x="20" y="20" width="300" height="290" rx="6"/>
  <text class="t" x="36" y="44">Frontend</text>
  <text class="s" x="36" y="62">JupyterLab or VS Code: shows the notebook</text>
  <rect class="inner" x="36" y="76" width="268" height="218" rx="4"/>
  <text class="l" x="48" y="96">analysis.ipynb</text>
  <rect class="acc" x="48" y="106" width="244" height="44" rx="3"/>
  <text class="lm" x="56" y="124">[1]</text>
  <text class="m" x="84" y="124">const greeting = <tspan class="str">"Hello"</tspan>;</text>
  <text class="m" x="84" y="140">greeting + <tspan class="str">", notebook"</tspan></text>
  <rect class="ok" x="48" y="152" width="244" height="26" rx="3"/>
  <text class="m" x="84" y="170"><tspan class="str">'Hello, notebook'</tspan></text>
  <rect class="acc" x="48" y="188" width="244" height="28" rx="3"/>
  <text class="lm" x="56" y="207">[2]</text>
  <text class="m" x="84" y="207">greeting.length</text>
  <rect class="ok" x="48" y="218" width="244" height="26" rx="3"/>
  <text class="m" x="84" y="236"><tspan class="num">5</tspan></text>
  <text class="l" x="56" y="268">code cells, each with its output,</text>
  <text class="l" x="56" y="283">saved together in one file</text>

  <!-- Frontend to kernel -->
  <line class="ln" x1="320" y1="140" x2="418" y2="140" marker-end="url(#a)"/>
  <text class="l" x="369" y="130" text-anchor="middle">each cell's code</text>
  <line class="ln" x1="320" y1="190" x2="418" y2="190" marker-start="url(#a)"/>
  <text class="l" x="369" y="208" text-anchor="middle">results, printed</text>
  <text class="l" x="369" y="222" text-anchor="middle">text, rich output</text>

  <!-- Kernel -->
  <rect class="acc" x="420" y="100" width="170" height="130" rx="6"/>
  <text class="t" x="505" y="134" text-anchor="middle">cdp-kernel</text>
  <text class="s" x="505" y="156" text-anchor="middle">the kernel: speaks</text>
  <text class="s" x="505" y="172" text-anchor="middle">Jupyter's protocol and</text>
  <text class="s" x="505" y="188" text-anchor="middle">drives the runtime</text>

  <!-- Kernel to runtime -->
  <line class="ln" x1="590" y1="165" x2="658" y2="165" marker-start="url(#a)" marker-end="url(#a)"/>

  <!-- Runtimes -->
  <rect class="box" x="660" y="20" width="180" height="290" rx="6"/>
  <text class="t" x="750" y="44" text-anchor="middle">Runtime</text>
  <text class="s" x="750" y="62" text-anchor="middle">the one you picked;</text>
  <text class="s" x="750" y="78" text-anchor="middle">your code runs here</text>
    <rect class="inner" x="676" y="96" width="148" height="26" rx="13"/>
    <text class="m" x="750" y="113" text-anchor="middle">Node</text>
    <rect class="inner" x="676" y="130" width="148" height="26" rx="13"/>
    <text class="m" x="750" y="147" text-anchor="middle">Deno</text>
    <rect class="inner" x="676" y="164" width="148" height="26" rx="13"/>
    <text class="m" x="750" y="181" text-anchor="middle">Bun</text>
    <rect class="inner" x="676" y="198" width="148" height="26" rx="13"/>
    <text class="m" x="750" y="215" text-anchor="middle">workerd</text>
    <rect class="inner" x="676" y="232" width="148" height="26" rx="13"/>
    <text class="m" x="750" y="249" text-anchor="middle">celld</text>
  <text class="l" x="750" y="290" text-anchor="middle">one kernel per runtime</text>
</svg>
