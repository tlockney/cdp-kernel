<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 488" width="860" height="488" role="img" aria-label="How an npm: or jsr: import uses cdp-kernel.lock.json">
  <title>How an npm: or jsr: import uses cdp-kernel.lock.json</title>
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #f6f7f9; stroke: #9aa3ad; stroke-width: 1.2; }
    .inner { fill: #ffffff; stroke: #b8c0c8; stroke-width: 1; }
    .acc { fill: #e8f0fe; stroke: #3b6fd8; stroke-width: 1.4; }
    .warn { fill: #fdf0e6; stroke: #c96a1b; stroke-width: 1.4; }
    .ok { fill: #e7f5ec; stroke: #2f8a4c; stroke-width: 1.4; }
    .t { font: 600 14px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1f2328; }
    .s { font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #57606a; }
    .m { font: 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #1f2328; }
    .l { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #57606a; }
    .lm { font: 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #57606a; }
    .ln { stroke: #6e7781; stroke-width: 1.4; fill: none; }
    .ah { fill: #6e7781; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1b1b1f; }
      .box { fill: #25262b; stroke: #5c6370; }
      .inner { fill: #1b1b1f; stroke: #4a505a; }
      .acc { fill: #1e2a44; stroke: #6b9bff; }
      .warn { fill: #3a2a1c; stroke: #e0904a; }
      .ok { fill: #1d3326; stroke: #5cc27e; }
      .t, .m { fill: #e6e8eb; }
      .s, .l, .lm { fill: #a0a7b0; }
      .ln { stroke: #a0a7b0; }
      .ah { fill: #a0a7b0; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="ah" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="860" height="488" rx="8"/>

  <!-- Start -->
  <rect class="acc" x="180" y="20" width="260" height="52" rx="4"/>
  <text class="m" x="310" y="42" text-anchor="middle">import "npm:pkg@^1.2"</text>
  <text class="s" x="310" y="61" text-anchor="middle">a cell on Node, Bun or workerd</text>

  <!-- Install lock container -->
  <rect class="box" x="20" y="96" width="580" height="300" rx="6" stroke-dasharray="5 4"/>
  <text class="l" x="32" y="114">Inside the npm or Bun cache's install lock</text>
  <text class="l" x="32" y="129">(another kernel installing waits)</text>

  <!-- Decision -->
  <line class="ln" x1="310" y1="72" x2="310" y2="111" marker-end="url(#a)"/>
  <polygon class="inner" points="310,112 450,150 310,188 170,150"/>
  <text class="s" x="310" y="146" text-anchor="middle">Lockfile entry for</text>
  <text class="m" x="310" y="163" text-anchor="middle">pkg@^1.2 ?</text>

  <path class="ln" d="M170,150 H120 V226" marker-end="url(#a)"/>
  <text class="l" x="120" y="214" text-anchor="middle" dx="-38">no lockfile</text>
  <line class="ln" x1="310" y1="188" x2="310" y2="226" marker-end="url(#a)"/>
  <text class="l" x="318" y="214">no entry</text>
  <path class="ln" d="M450,150 H500 V226" marker-end="url(#a)"/>
  <text class="lm" x="508" y="214">"1.4.0"</text>

  <!-- Row 1: install -->
  <rect class="inner" x="35" y="228" width="170" height="52" rx="4"/>
  <text class="s" x="120" y="250" text-anchor="middle">Install the range</text>
  <text class="s" x="120" y="268" text-anchor="middle">(newest match)</text>
  <rect class="inner" x="225" y="228" width="170" height="52" rx="4"/>
  <text class="s" x="310" y="250" text-anchor="middle">Install the range</text>
  <text class="s" x="310" y="268" text-anchor="middle">(newest match)</text>
  <rect class="ok" x="415" y="228" width="170" height="52" rx="4"/>
  <text class="s" x="500" y="250" text-anchor="middle">Install 1.4.0 exactly,</text>
  <text class="s" x="500" y="268" text-anchor="middle">on any machine</text>

  <line class="ln" x1="120" y1="280" x2="120" y2="318" marker-end="url(#a)"/>
  <line class="ln" x1="310" y1="280" x2="310" y2="318" marker-end="url(#a)"/>
  <line class="ln" x1="500" y1="280" x2="500" y2="318" marker-end="url(#a)"/>

  <!-- Row 2: record -->
  <rect class="inner" x="35" y="320" width="170" height="52" rx="4"/>
  <text class="s" x="120" y="351" text-anchor="middle">Nothing recorded</text>
  <rect class="acc" x="225" y="320" width="170" height="52" rx="4"/>
  <text class="s" x="310" y="342" text-anchor="middle">Record the version</text>
  <text class="s" x="310" y="360" text-anchor="middle">it resolved to</text>
  <rect class="inner" x="415" y="320" width="170" height="52" rx="4"/>
  <text class="s" x="500" y="351" text-anchor="middle">Lockfile unchanged</text>

  <!-- Lockfile -->
  <rect class="warn" x="640" y="200" width="200" height="146" rx="4"/>
  <text class="m" x="740" y="222" text-anchor="middle">cdp-kernel.lock.json</text>
  <line class="ln" x1="652" y1="232" x2="828" y2="232" stroke-dasharray="2 3"/>
  <text class="lm" x="656" y="252">{</text>
  <text class="lm" x="656" y="332">}</text>
  <text class="lm" x="670" y="268">"version": 1,</text>
  <text class="lm" x="670" y="284">"packages": {</text>
  <text class="lm" x="684" y="300">"pkg@^1.2": "1.4.0"</text>
  <text class="lm" x="670" y="316">}</text>
  <path class="ln" d="M310,372 V420 H740 V348" marker-end="url(#a)"/>
  <text class="l" x="530" y="414">writes (sorted; temp file, then rename)</text>
  <path class="ln" d="M640,254 H587" marker-end="url(#a)"/>
  <text class="l" x="613" y="246" text-anchor="middle">read</text>
  <text class="l" x="740" y="158" text-anchor="middle">In the notebook's directory or above.</text>
  <text class="l" x="740" y="174" text-anchor="middle">Create it with {} to start locking;</text>
  <text class="l" x="740" y="190" text-anchor="middle">commit it with the notebook.</text>

  <text class="l" x="20" y="452">A version already in the cache isn't installed again.</text>
  <text class="l" x="20" y="470">Deno targets resolve with Deno and run with --no-lock: no lockfile at all. Pin with an exact version, npm:pkg@1.4.0.</text>
</svg>
