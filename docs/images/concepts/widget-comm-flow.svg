<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 572" width="860" height="572" role="img" aria-label="The messages between the kernel and the frontend for one widget">
  <title>The messages between the kernel and the frontend for one widget</title>
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #f6f7f9; stroke: #9aa3ad; stroke-width: 1.2; }
    .inner { fill: #ffffff; stroke: #b8c0c8; stroke-width: 1; }
    .acc { fill: #e8f0fe; stroke: #3b6fd8; stroke-width: 1.4; }
    .warn { fill: #fdf0e6; stroke: #c96a1b; stroke-width: 1.4; }
    .ok { fill: #e7f5ec; stroke: #2f8a4c; stroke-width: 1.4; }
    .t { font: 600 14px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1f2328; }
    .s { font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #57606a; }
    .m { font: 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #1f2328; }
    .l { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #57606a; }
    .lm { font: 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #57606a; }
    .ln { stroke: #6e7781; stroke-width: 1.4; fill: none; }
    .ah { fill: #6e7781; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1b1b1f; }
      .box { fill: #25262b; stroke: #5c6370; }
      .inner { fill: #1b1b1f; stroke: #4a505a; }
      .acc { fill: #1e2a44; stroke: #6b9bff; }
      .warn { fill: #3a2a1c; stroke: #e0904a; }
      .ok { fill: #1d3326; stroke: #5cc27e; }
      .t, .m { fill: #e6e8eb; }
      .s, .l, .lm { fill: #a0a7b0; }
      .ln { stroke: #a0a7b0; }
      .ah { fill: #a0a7b0; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="ah" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="860" height="572" rx="8"/>

  <!-- Headers and lifelines -->
  <rect class="acc" x="160" y="20" width="180" height="50" rx="4"/>
  <text class="t" x="250" y="41" text-anchor="middle">Kernel</text>
  <text class="s" x="250" y="59" text-anchor="middle">the model, in the runtime</text>
  <rect class="acc" x="520" y="20" width="180" height="50" rx="4"/>
  <text class="t" x="610" y="41" text-anchor="middle">Frontend</text>
  <text class="s" x="610" y="59" text-anchor="middle">anywidget, in the browser</text>
  <line class="ln" x1="250" y1="70" x2="250" y2="478" stroke-dasharray="2 4"/>
  <line class="ln" x1="610" y1="70" x2="610" y2="478" stroke-dasharray="2 4"/>

  <!-- Legend -->
  <line class="ln" x1="368" y1="34" x2="400" y2="34"/>
  <text class="l" x="406" y="38">iopub</text>
  <line class="ln" x1="368" y1="56" x2="400" y2="56" stroke-dasharray="5 3"/>
  <text class="l" x="406" y="60">shell</text>

  <!-- 1. comm_open -->
  <text class="m" x="20" y="106">jupyter.widget({...})</text>
  <text class="s" x="20" y="124">opens the comm</text>
  <line class="ln" x1="250" y1="112" x2="608" y2="112" marker-end="url(#a)"/>
  <text class="m" x="430" y="104" text-anchor="middle">comm_open</text>
  <text class="l" x="430" y="128" text-anchor="middle">target jupyter.widget; whole state, with _esm and _css</text>
  <text class="s" x="630" y="106">Creates the model, a</text>
  <text class="s" x="630" y="124">browser copy of the state</text>

  <!-- 2. display_data -->
  <text class="s" x="20" y="172">The widget is the cell's</text>
  <text class="s" x="20" y="190">result, or jupyter.display()</text>
  <line class="ln" x1="250" y1="178" x2="608" y2="178" marker-end="url(#a)"/>
  <text class="m" x="430" y="170" text-anchor="middle">display_data</text>
  <text class="lm" x="430" y="194" text-anchor="middle">application/vnd.jupyter.widget-view+json</text>
  <text class="s" x="630" y="172">Loads esm and calls</text>
  <text class="m" x="630" y="190">render({ model, el })</text>

  <!-- 3. update from the view -->
  <text class="m" x="630" y="238">model.set(key, value)</text>
  <text class="m" x="630" y="256">model.save_changes()</text>
  <line class="ln" x1="610" y1="244" x2="252" y2="244" stroke-dasharray="5 3" marker-end="url(#a)"/>
  <text class="m" x="430" y="236" text-anchor="middle">comm_msg  method: "update"</text>
  <text class="l" x="430" y="260" text-anchor="middle">the changed keys</text>
  <rect class="warn" x="20" y="220" width="210" height="62" rx="4"/>
  <text class="s" x="30" y="240">Waits for a running cell,</text>
  <text class="s" x="30" y="257">then runs the listeners</text>
  <text class="m" x="30" y="274">on("change:key", fn)</text>

  <!-- 4. update from the kernel -->
  <text class="m" x="20" y="318">widget.set(key, value)</text>
  <text class="s" x="20" y="336">goes out at once, mid-cell too</text>
  <line class="ln" x1="250" y1="324" x2="608" y2="324" marker-end="url(#a)"/>
  <text class="m" x="430" y="316" text-anchor="middle">comm_msg  method: "update"</text>
  <text class="l" x="430" y="340" text-anchor="middle">the changed keys</text>
  <text class="m" x="630" y="318">model.on("change:key")</text>
  <text class="s" x="630" y="336">redraws every view</text>

  <!-- 5. custom messages -->
  <text class="m" x="20" y="384">widget.send(content)</text>
  <text class="m" x="20" y="402">on("msg:custom", fn)</text>
  <line class="ln" x1="250" y1="384" x2="608" y2="384" marker-end="url(#a)"/>
  <line class="ln" x1="610" y1="398" x2="252" y2="398" stroke-dasharray="5 3" marker-end="url(#a)"/>
  <text class="m" x="430" y="376" text-anchor="middle">comm_msg  method: "custom"</text>
  <text class="l" x="430" y="414" text-anchor="middle">either way; not kept in the state</text>
  <text class="m" x="630" y="384">model.on("msg:custom")</text>
  <text class="m" x="630" y="402">model.send(content)</text>

  <!-- 6. comm_close -->
  <text class="m" x="20" y="456">widget.close()</text>
  <line class="ln" x1="250" y1="452" x2="608" y2="452" marker-end="url(#a)"/>
  <text class="m" x="430" y="444" text-anchor="middle">comm_close</text>
  <text class="s" x="630" y="456">Views stop syncing</text>

  <!-- Scheduling -->
  <rect class="box" x="20" y="494" width="820" height="58" rx="4"/>
  <text class="s" x="34" y="517">The kernel handles shell messages one at a time, in order with cells (execute_request): a click during a long</text>
  <text class="s" x="34" y="537">cell reaches its listener only when the cell ends. iopub messages from the kernel are not queued behind cells.</text>
</svg>
