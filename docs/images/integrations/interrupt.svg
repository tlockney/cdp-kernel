<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 626" width="860" height="626" role="img" aria-label="The frontend's Interrupt button sends interrupt_request on the control socket, and the kernel host calls interrupt() on the target. On Node and Deno, a paused debugger is resumed, the host sends Runtime.terminateExecution on the control session and abandons the pending evaluate, and state is kept. On Bun, workerd and celld the host sends a ping: a waiting cell answers within 500 ms, so its request is abandoned and state kept; a busy cell can't answer, so the runtime is killed and restarts on the next cell without the earlier state.">
  <title>How an interrupt reaches a running cell on each kind of target</title>
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #f6f7f9; stroke: #9aa3ad; stroke-width: 1.2; }
    .inner { fill: #ffffff; stroke: #b8c0c8; stroke-width: 1; }
    .acc { fill: #e8f0fe; stroke: #3b6fd8; stroke-width: 1.4; }
    .warn { fill: #fdf0e6; stroke: #c96a1b; stroke-width: 1.4; }
    .ok { fill: #e7f5ec; stroke: #2f8a4c; stroke-width: 1.4; }
    .t { font: 600 14px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1f2328; }
    .s { font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #57606a; }
    .m { font: 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #1f2328; }
    .l { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #57606a; }
    .lm { font: 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #57606a; }
    .ln { stroke: #6e7781; stroke-width: 1.4; fill: none; }
    .ah { fill: #6e7781; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1b1b1f; }
      .box { fill: #25262b; stroke: #5c6370; }
      .inner { fill: #1b1b1f; stroke: #4a505a; }
      .acc { fill: #1e2a44; stroke: #6b9bff; }
      .warn { fill: #3a2a1c; stroke: #e0904a; }
      .ok { fill: #1d3326; stroke: #5cc27e; }
      .t, .m { fill: #e6e8eb; }
      .s, .l, .lm { fill: #a0a7b0; }
      .ln { stroke: #a0a7b0; }
      .ah { fill: #a0a7b0; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="ah" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="860" height="626" rx="8"/>
  <!-- Entry: the frontend asks for an interrupt -->
  <rect class="box" x="290" y="20" width="280" height="44" rx="6"/>
  <text class="s" x="430" y="46" text-anchor="middle">Kernel › Interrupt (■) in the frontend</text>
  <path class="ln" d="M430,64 V94" marker-end="url(#a)"/>
  <text class="lm" x="440" y="83">interrupt_request, control socket</text>
  <rect class="box" x="290" y="96" width="280" height="44" rx="6"/>
  <text class="m" x="430" y="122" text-anchor="middle">target.interrupt()</text>
  <text class="l" x="580" y="122">in the kernel host</text>
  <path class="ln" d="M430,140 V154 H220 V168" marker-end="url(#a)"/>
  <path class="ln" d="M430,154 H640 V168" marker-end="url(#a)"/>

  <rect class="box" x="20" y="170" width="400" height="406" rx="6"/>
  <rect class="box" x="440" y="170" width="400" height="406" rx="6"/>
  <text class="t" x="220" y="194" text-anchor="middle">Node, Deno (CDP)</text>
  <text class="t" x="640" y="194" text-anchor="middle">Bun, workerd, celld</text>

  <!-- Node and Deno -->
  <polygon class="inner" points="150,220 250,260 150,300 50,260"/>
  <text class="s" x="150" y="256" text-anchor="middle">Paused in the</text>
  <text class="s" x="150" y="272" text-anchor="middle">debugger?</text>
  <path class="ln" d="M250,260 H272" marker-end="url(#a)"/>
  <text class="l" x="261" y="252" text-anchor="middle">yes</text>
  <rect class="acc" x="274" y="238" width="130" height="44" rx="4"/>
  <text class="s" x="339" y="264" text-anchor="middle">Debugger.resume</text>
  <path class="ln" d="M150,300 V322" marker-end="url(#a)"/>
  <text class="l" x="158" y="314">no</text>
  <path class="ln" d="M339,282 V322" marker-end="url(#a)"/>
  <rect class="acc" x="50" y="324" width="340" height="52" rx="4"/>
  <text class="m" x="220" y="345" text-anchor="middle">Runtime.terminateExecution</text>
  <text class="l" x="220" y="363" text-anchor="middle">on the control session</text>
  <path class="ln" d="M220,376 V394" marker-end="url(#a)"/>
  <rect class="inner" x="50" y="396" width="340" height="52" rx="4"/>
  <text class="s" x="220" y="417" text-anchor="middle">Abandon the pending Runtime.evaluate</text>
  <text class="l" x="220" y="435" text-anchor="middle">on the shell session</text>
  <path class="ln" d="M220,448 V466" marker-end="url(#a)"/>
  <rect class="ok" x="50" y="468" width="340" height="70" rx="4"/>
  <text class="s" x="220" y="498" text-anchor="middle">Cell ends with “Interrupted”;</text>
  <text class="s" x="220" y="516" text-anchor="middle">busy or waiting, state is kept</text>

  <!-- Bun, workerd, celld -->
  <rect class="acc" x="520" y="216" width="240" height="44" rx="4"/>
  <text class="s" x="640" y="242" text-anchor="middle">Send a ping request</text>
  <path class="ln" d="M640,260 V272" marker-end="url(#a)"/>
  <polygon class="inner" points="640,272 760,310 640,348 520,310"/>
  <text class="s" x="640" y="306" text-anchor="middle">Answered within</text>
  <text class="s" x="640" y="322" text-anchor="middle">500 ms?</text>
  <path class="ln" d="M520,310 H470 V466" marker-end="url(#a)"/>
  <text class="l" x="494" y="302" text-anchor="middle">yes</text>
  <path class="ln" d="M760,310 H810 V466" marker-end="url(#a)"/>
  <text class="l" x="786" y="302" text-anchor="middle">no</text>
  <text class="l" x="640" y="372" text-anchor="middle">A cell that is waiting (a timer,</text>
  <text class="l" x="640" y="387" text-anchor="middle">fetch, a promise) leaves the event</text>
  <text class="l" x="640" y="402" text-anchor="middle">loop free and answers at once.</text>
  <text class="l" x="640" y="417" text-anchor="middle">A busy cell can’t answer at all.</text>
  <rect class="ok" x="450" y="468" width="180" height="94" rx="4"/>
  <text class="s" x="540" y="492" text-anchor="middle">Waiting, not busy:</text>
  <text class="s" x="540" y="510" text-anchor="middle">abandon its request.</text>
  <text class="s" x="540" y="528" text-anchor="middle">State is kept; work it</text>
  <text class="s" x="540" y="546" text-anchor="middle">started keeps running</text>
  <rect class="warn" x="650" y="468" width="180" height="94" rx="4"/>
  <text class="s" x="740" y="492" text-anchor="middle">Busy: kill the runtime.</text>
  <text class="s" x="740" y="510" text-anchor="middle">It restarts on the next</text>
  <text class="s" x="740" y="528" text-anchor="middle">cell without the earlier</text>
  <text class="s" x="740" y="546" text-anchor="middle">cells’ state</text>

  <!-- Legend -->
  <rect class="acc" x="20" y="592" width="28" height="14" rx="3"/>
  <text class="l" x="56" y="603">a request the host sends</text>
  <rect class="ok" x="218" y="592" width="28" height="14" rx="3"/>
  <text class="l" x="254" y="603">cell stops, state kept</text>
  <rect class="warn" x="405" y="592" width="28" height="14" rx="3"/>
  <text class="l" x="441" y="603">runtime stopped, state lost (see Choosing a runtime)</text>
</svg>
