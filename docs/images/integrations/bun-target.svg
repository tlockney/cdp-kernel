<svg xmlns="http://www.w3.org/2000/svg" viewBox="8 18 844 360" width="844" height="360" role="img" aria-label="The Bun target: requests and replies as JSON lines on a private fd 3 pipe, output on stdout and stderr">
  <title>The Bun target: requests and replies as JSON lines on a private fd 3 pipe, output on stdout and stderr</title>
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #f6f7f9; stroke: #9aa3ad; stroke-width: 1.2; }
    .inner { fill: #ffffff; stroke: #b8c0c8; stroke-width: 1; }
    .acc { fill: #e8f0fe; stroke: #3b6fd8; stroke-width: 1.4; }
    .warn { fill: #fdf0e6; stroke: #c96a1b; stroke-width: 1.4; }
    .ok { fill: #e7f5ec; stroke: #2f8a4c; stroke-width: 1.4; }
    .t { font: 600 14px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1f2328; }
    .s { font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #57606a; }
    .m { font: 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #1f2328; }
    .l { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #57606a; }
    .lm { font: 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #57606a; }
    .ln { stroke: #6e7781; stroke-width: 1.4; fill: none; }
    .ah { fill: #6e7781; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1b1b1f; }
      .box { fill: #25262b; stroke: #5c6370; }
      .inner { fill: #1b1b1f; stroke: #4a505a; }
      .acc { fill: #1e2a44; stroke: #6b9bff; }
      .warn { fill: #3a2a1c; stroke: #e0904a; }
      .ok { fill: #1d3326; stroke: #5cc27e; }
      .t, .m { fill: #e6e8eb; }
      .s, .l, .lm { fill: #a0a7b0; }
      .ln { stroke: #a0a7b0; }
      .ah { fill: #a0a7b0; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="ah" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="bg" x="8" y="18" width="844" height="360" rx="8"/>
  <!-- Host -->
  <rect class="box" x="20" y="30" width="200" height="335" rx="6"/>
  <text class="t" x="120" y="54" text-anchor="middle">Kernel host · BunTarget</text>
  <rect class="acc" x="35" y="66" width="170" height="90" rx="4"/>
  <text class="t" x="120" y="96" text-anchor="middle">fd 3 channel</text>
  <text class="l" x="120" y="116" text-anchor="middle">pending requests by id</text>
  <text class="l" x="120" y="134" text-anchor="middle">iopub → barrier wait</text>
  <rect class="inner" x="35" y="195" width="170" height="40" rx="4"/>
  <text class="m" x="120" y="220" text-anchor="middle">PipeDemux (stdout)</text>
  <rect class="inner" x="35" y="250" width="170" height="40" rx="4"/>
  <text class="m" x="120" y="275" text-anchor="middle">PipeDemux (stderr)</text>
  <rect class="inner" x="35" y="305" width="170" height="40" rx="4"/>
  <text class="m" x="120" y="330" text-anchor="middle">child stdin</text>

  <!-- Bun -->
  <rect class="box" x="520" y="30" width="320" height="335" rx="6"/>
  <text class="t" x="680" y="54" text-anchor="middle">bun process (no inspector)</text>
  <rect class="inner" x="535" y="66" width="290" height="110" rx="4"/>
  <text class="m" x="680" y="88" text-anchor="middle">bun-channel.mjs → evaluator.mjs</text>
  <text class="l" x="680" y="110" text-anchor="middle">cells run in-process as global code</text>
  <text class="l" x="680" y="128" text-anchor="middle">(indirect eval inside an async function)</text>
  <text class="l" x="680" y="146" text-anchor="middle">results kept as handles h1, h2, …</text>
  <text class="l" x="680" y="164" text-anchor="middle">in place of CDP objectIds</text>
  <rect class="inner" x="535" y="190" width="290" height="160" rx="4"/>
  <text class="m" x="680" y="214" text-anchor="middle">runtime/bootstrap.mjs</text>
  <text class="m" x="680" y="236" text-anchor="middle">globalThis.__cdpk</text>
  <text class="l" x="680" y="260" text-anchor="middle">jupyter namespace (display.mjs)</text>
  <text class="l" x="680" y="280" text-anchor="middle">npm: and jsr: via bun add</text>
  <text class="l" x="680" y="300" text-anchor="middle">bare names from the notebook directory</text>
  <text class="l" x="680" y="320" text-anchor="middle">prompt() blocks on a stdin read</text>
  <!-- Channels -->
  <line class="ln" x1="205" y1="95" x2="535" y2="95" marker-end="url(#a)"/>
  <text class="lm" x="370" y="87" text-anchor="middle">{id, op: eval | broadcast | describe |</text>
  <text class="lm" x="370" y="111" text-anchor="middle">comm | props | inspect | barrier | ping}</text>
  <line class="ln" x1="535" y1="135" x2="205" y2="135" marker-end="url(#a)"/>
  <text class="lm" x="370" y="151" text-anchor="middle">{kind: ready | reply | iopub}</text>
  <line class="ln" x1="535" y1="215" x2="205" y2="215" marker-end="url(#a)"/>
  <text class="l" x="370" y="207" text-anchor="middle">stdout, with barrier markers</text>
  <line class="ln" x1="535" y1="270" x2="205" y2="270" marker-end="url(#a)"/>
  <text class="l" x="370" y="262" text-anchor="middle">stderr, with barrier markers</text>
  <line class="ln" x1="205" y1="325" x2="535" y2="325" marker-end="url(#a)"/>
  <text class="l" x="370" y="317" text-anchor="middle">prompt() reply, one JSON line</text>

</svg>
