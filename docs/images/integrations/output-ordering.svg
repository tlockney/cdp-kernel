<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" width="860" height="380" role="img" aria-label="On Node and Deno the target writes a gated marker numbered 7 to stderr, then message 7 as a record on stdout, between the cell's other output. The host publishes the message only after both pipes reach 7, and holds pipe text after the marker until the message is out, so the frontend sees stream a, the display, then stream b. On Bun the message goes over fd 3 and both pipes carry the marker; workerd and celld need no markers.">
  <title>Barrier markers keep pipe output and display messages in the order the cell produced them</title>
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #f6f7f9; stroke: #9aa3ad; stroke-width: 1.2; }
    .inner { fill: #ffffff; stroke: #b8c0c8; stroke-width: 1; }
    .acc { fill: #e8f0fe; stroke: #3b6fd8; stroke-width: 1.4; }
    .warn { fill: #fdf0e6; stroke: #c96a1b; stroke-width: 1.4; }
    .ok { fill: #e7f5ec; stroke: #2f8a4c; stroke-width: 1.4; }
    .t { font: 600 14px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1f2328; }
    .s { font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #57606a; }
    .m { font: 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #1f2328; }
    .l { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #57606a; }
    .lm { font: 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #57606a; }
    .ln { stroke: #6e7781; stroke-width: 1.4; fill: none; }
    .ah { fill: #6e7781; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1b1b1f; }
      .box { fill: #25262b; stroke: #5c6370; }
      .inner { fill: #1b1b1f; stroke: #4a505a; }
      .acc { fill: #1e2a44; stroke: #6b9bff; }
      .warn { fill: #3a2a1c; stroke: #e0904a; }
      .ok { fill: #1d3326; stroke: #5cc27e; }
      .t, .m { fill: #e6e8eb; }
      .s, .l, .lm { fill: #a0a7b0; }
      .ln { stroke: #a0a7b0; }
      .ah { fill: #a0a7b0; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="ah" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="860" height="380" rx="8"/>
  <text class="t" x="20" y="34">What the target writes on Node and Deno (time runs left to right)</text>
  <text class="lm" x="20" y="54">console.log("a"); display(x); console.log("b")</text>
  <text class="s" x="20" y="88">stdout pipe</text>
  <text class="s" x="20" y="144">stderr pipe</text>
  <line class="ln" x1="110" y1="84" x2="540" y2="84" stroke-dasharray="3 4"/>
  <line class="ln" x1="110" y1="140" x2="540" y2="140" stroke-dasharray="3 4"/>
  <path class="ln" d="M540,84 H558" marker-end="url(#a)"/>
  <path class="ln" d="M540,140 H558" marker-end="url(#a)"/>
  <rect class="inner" x="120" y="68" width="64" height="32" rx="4"/>
  <text class="m" x="152" y="88" text-anchor="middle">"a\n"</text>
  <rect class="acc" x="250" y="68" width="196" height="32" rx="4"/>
  <text class="m" x="348" y="88" text-anchor="middle">⟨record 7: display_data⟩</text>
  <rect class="inner" x="462" y="68" width="64" height="32" rx="4"/>
  <text class="m" x="494" y="88" text-anchor="middle">"b\n"</text>
  <text class="l" x="348" y="114" text-anchor="middle">message 7, as a record</text>
  <rect class="acc" x="202" y="124" width="64" height="32" rx="4"/>
  <text class="m" x="234" y="144" text-anchor="middle">⟨7m⟩</text>
  <text class="l" x="234" y="170" text-anchor="middle">marker 7, written first;</text>
  <text class="l" x="234" y="184" text-anchor="middle">“m” = gated, see step 3</text>
  <text class="l" x="20" y="216">On Bun, message 7 goes over fd 3 instead, and both pipes carry ⟨7m⟩.</text>

  <!-- Host rules -->
  <rect class="box" x="560" y="64" width="280" height="176" rx="6"/>
  <text class="t" x="700" y="90" text-anchor="middle">Host: PipeDemux + Gates</text>
  <text class="s" x="576" y="116">1. Hold message 7 until stdout and</text>
  <text class="s" x="592" y="134">stderr have both reached 7 (on</text>
  <text class="s" x="592" y="152">stdout, the record counts).</text>
  <text class="s" x="576" y="178">2. Publish it on iopub.</text>
  <text class="s" x="576" y="204">3. Open gate 7: pipe text after a</text>
  <text class="s" x="592" y="222">gated marker waits until then.</text>
  <path class="ln" d="M700,240 V264" marker-end="url(#a)"/>

  <!-- Result -->
  <text class="t" x="20" y="288">What the frontend sees on iopub</text>
  <rect class="inner" x="420" y="266" width="110" height="34" rx="4"/>
  <text class="m" x="475" y="288" text-anchor="middle">stream "a"</text>
  <line class="ln" x1="530" y1="283" x2="558" y2="283" marker-end="url(#a)"/>
  <rect class="warn" x="560" y="266" width="120" height="34" rx="4"/>
  <text class="m" x="620" y="288" text-anchor="middle">display_data</text>
  <line class="ln" x1="680" y1="283" x2="708" y2="283" marker-end="url(#a)"/>
  <rect class="inner" x="710" y="266" width="130" height="34" rx="4"/>
  <text class="m" x="775" y="288" text-anchor="middle">stream "b"</text>

  <!-- Legend -->
  <rect class="acc" x="20" y="322" width="28" height="14" rx="3"/>
  <text class="l" x="56" y="333">barrier markers and message records</text>
  <rect class="warn" x="280" y="322" width="28" height="14" rx="3"/>
  <text class="l" x="316" y="333">display_data published on iopub</text>
  <rect class="inner" x="518" y="322" width="28" height="14" rx="3"/>
  <text class="l" x="554" y="333">plain pipe text</text>
  <text class="l" x="20" y="360">workerd and celld don’t need markers: output, messages and replies share one WebSocket, which keeps their order.</text>
</svg>
